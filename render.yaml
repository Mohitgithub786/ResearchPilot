services:
  - type: web
    name: researchpilot-backend
    runtime: docker
    plan: free
    healthCheckPath: /health

    envVars:
      - key: CHUNK_SIZE
        value: "1000"

      - key: CHUNK_OVERLAP
        value: "200"

      - key: EMBEDDING_PROVIDER
        value: openai

      - key: LLM_PROVIDER
        value: groq

      - key: OPENAI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: researchpilot-frontend
    runtime: python
    plan: free
    rootDir: gradio_app
    buildCommand: pip install -r ../requirements.txt
    startCommand: python app.py

    envVars:
      - key: FASTAPI_BASE_URL
        sync: false